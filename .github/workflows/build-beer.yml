name: Rebuild beer.js on data change

on:
  push:
    branches: [main]
    paths:
      - 'data/beer.jsonl'
      - 'scripts/build-beer.cjs'

permissions:
  contents: write

concurrency:
  group: build-beer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a PAT-friendly token so the auto-commit triggers Pages redeploy
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild js/beer.js from beer.jsonl
        run: node scripts/build-beer.cjs

      - name: Cache-bust beer.js reference in pages/beer.html
        run: |
          # Use the short SHA of the commit that triggered this build as version
          VER=$(git rev-parse --short HEAD)
          # Replace any existing ?v=... on beer.js (or add one if missing)
          sed -i -E "s#(../js/beer\.js)(\?v=[^\"]*)?#\1?v=${VER}#g" pages/beer.html
          echo "Bumped beer.js version to ${VER}"

      - name: Commit regenerated files (if changed)
        run: |
          git config user.name "beer-bot"
          git config user.email "beer-bot@users.noreply.github.com"
          if git diff --quiet js/beer.js pages/beer.html; then
            echo "No changes to commit"
          else
            git add js/beer.js pages/beer.html
            git commit -m "auto: rebuild beer.js + bump cache version [skip ci]"
            git push
          fi
